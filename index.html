
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <div class="bg-[url('badal.jpg')] bg-cover bg-center min-h-screen pb-10">

       
        <div id="cityName" class="text-center text-5xl pt-8 text-white font-bold">
         Weather App
        </div>

        <div class="flex justify-center items-center my-8">
            <img src="logo.jpg" alt="Weather Logo"
                class="border-2 border-white rounded-full h-36 w-36 object-cover">
        </div>

        <div class="flex flex-wrap justify-center gap-5 px-4 mt-10">

            <button id="wind"
                class="h-20 w-64 max-w-full text-2xl border-2 rounded-2xl font-serif bg-white hover:bg-blue-200">
                Wind
            </button>

            <button id="longitude"
                class="h-20 w-64 max-w-full text-2xl border-2 rounded-2xl font-serif bg-white hover:bg-blue-200">
                Longitude
            </button>

            <button id="latitude"
                class="h-20 w-64 max-w-full text-2xl border-2 rounded-2xl font-serif bg-white hover:bg-blue-200">
                Latitude
            </button>

            <button id="description"
                class="h-20 w-64 max-w-full text-2xl border-2 rounded-2xl font-serif bg-white hover:bg-blue-200">
                Description
            </button>

            <button id="temperature"
                class="h-20 w-64 max-w-full text-2xl border-2 rounded-2xl font-serif bg-white hover:bg-blue-200">
                Temperature
            </button>

        </div>

        <div class="flex flex-wrap justify-center gap-5 px-4 mt-6">

            <button id="feelsLike"
                class="h-20 w-64 max-w-full text-2xl border-2 rounded-2xl font-serif bg-white hover:bg-blue-200">
                Feels Like
            </button>

            <button id="humidity"
                class="h-20 w-64 max-w-full text-2xl border-2 rounded-2xl font-serif bg-white hover:bg-blue-200">
                Humidity
            </button>

            <button id="pressure"
                class="h-20 w-64 max-w-full text-2xl border-2 rounded-2xl font-serif bg-white hover:bg-blue-200">
                Pressure
            </button>

            <button id="country"
                class="h-20 w-64 max-w-full text-2xl border-2 rounded-2xl font-serif bg-white hover:bg-blue-200">
                Country
            </button>

            <button id="city"
                class="h-20 w-64 max-w-full text-2xl border-2 rounded-2xl font-serif bg-white hover:bg-blue-200">
                Name
            </button>

        </div>

        <div class="flex flex-wrap justify-center items-center gap-4 mt-12 px-4">

            <input id="cityInput" type="search"
                placeholder="Enter City name"
                class="w-full max-w-2xl h-16 bg-white border-2 rounded-2xl px-5 text-xl">

            <button id="searchBtn"
                class="h-16 w-48 max-w-full bg-blue-950 text-white text-2xl rounded-2xl hover:bg-blue-400">
                Search
            </button>

            



        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
